# Lets Codex users (and anyone without the plugin) install the CLI: uv tool install <path to this folder>
[project]
name = "docs-index"
version = "1.0.0"
description = "Set up and check a docs/ tree with INDEX.md and BIBLIOGRAPHY.md."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
docs-index = "docs_index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"scripts/docs_index.py" = "docs_index.py"
